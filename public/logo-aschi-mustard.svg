<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 550" width="100%" height="100%">
  <defs>
    <!-- Rich Vibrant Mustard Yellow Gradient (Primary) -->
    <linearGradient id="mustardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55" /> <!-- Vibrant Mustard Highlight -->
      <stop offset="30%" stop-color="#EAA812" /> <!-- Pure Mustard Yellow -->
      <stop offset="70%" stop-color="#D49206" /> <!-- Rich Warm Ochre -->
      <stop offset="100%" stop-color="#A86C00" /> <!-- Deep Amber Shadow -->
    </linearGradient>

    <!-- Warm Light Mustard / Golden Ochre (for highlights & handle) -->
    <linearGradient id="mustardLightGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="45%" stop-color="#F2BC2E" />
      <stop offset="100%" stop-color="#C78704" />
    </linearGradient>

    <!-- Dark Contrast Gradient (Walnut / Espresso for Compass Legs & 3D Depth) -->
    <linearGradient id="darkWoodContrast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42291B" /> <!-- Dark Walnut -->
      <stop offset="50%" stop-color="#28170D" /> <!-- Deep Espresso -->
      <stop offset="100%" stop-color="#140905" /> <!-- Charcoal Wood -->
    </linearGradient>

    <!-- Metallic Steel / Chrome Gradient for Chisel Blade -->
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9" />
      <stop offset="40%" stop-color="#CBC5BC" />
      <stop offset="80%" stop-color="#918A7F" />
      <stop offset="100%" stop-color="#5E574D" />
    </linearGradient>

    <!-- Deep 3D Shadow for Web & High Contrast -->
    <filter id="logo3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Subtle Luminous Aura for Mustard Details -->
    <filter id="mustardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#543600" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- ==================== 3D SHADOW LAYER (Extruded silhouette) ==================== -->
  <g transform="translate(5, 7)" opacity="0.55" filter="url(#logo3DShadow)">
    <!-- Horizontal guide rod shadow -->
    <line x1="120" y1="210" x2="252" y2="210" stroke="#000" stroke-width="11" stroke-linecap="round" />
    <circle cx="236" cy="210" r="14" fill="#000" />
    <!-- Compass Legs shadow (EXTRA BOLD) -->
    <polygon points="156,116 178,116 86,494 62,494" fill="#000" />
    <polygon points="156,116 178,116 250,494 274,494" fill="#000" />
    <!-- Compass Head shadow -->
    <circle cx="167" cy="70" r="33" stroke="#000" stroke-width="18" fill="none" />
    <rect x="156" y="94" width="22" height="24" fill="#000" />
    <circle cx="167" cy="116" r="20" fill="#000" />
    <path d="M 167,37 L 167,23" stroke="#000" stroke-width="12" stroke-linecap="round" />
    <!-- Chisel shadow (EXTRA BOLD) -->
    <path d="M 12,428 C 18,418 30,394 72,372 C 114,350 126,342 132,348 C 135,353 116,376 80,406 C 44,436 18,444 12,428 Z" fill="#000" />
    <path d="M 132,346 L 296,238" stroke="#000" stroke-width="18" stroke-linecap="round" />
    <polygon points="290,240 304,230 316,246 300,256" fill="#000" />
    <!-- Curving text shadow -->
    <g transform="translate(104, 308) rotate(-78)">
      <text x="0" y="0" fill="#000" font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="900" letter-spacing="4">artisanat</text>
    </g>
    <!-- Text aschi shadow (EXTRA BOLD) -->
    <g stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 106,412 L 106,488 C 106,494 109,496 113,496 M 106,436 C 90,436 84,448 84,466 C 84,482 95,493 106,484" />
      <path d="M 148,422 C 148,413 133,413 130,428 C 127,442 149,450 147,466 C 145,483 129,485 124,474" />
      <path d="M 181,427 C 176,414 161,414 161,452 C 161,486 176,486 181,474" />
      <path d="M 197,386 L 197,490 M 197,440 C 205,428 220,428 220,448 L 220,490" />
      <path d="M 235,422 L 235,490 M 235,397 A 3,3 0 1,1 235,403" />
    </g>
  </g>

  <!-- ==================== FRONT VECTOR LAYER (EXTRA BOLD & SHARP) ==================== -->
  
  <!-- 1. Horizontal Guide Rod & Adjustment Screw -->
  <g>
    <line x1="120" y1="210" x2="252" y2="210" stroke="url(#darkWoodContrast)" stroke-width="9.5" stroke-linecap="round" />
    <!-- Mustard Yellow Screw / Nut -->
    <circle cx="236" cy="210" r="13" fill="url(#mustardGradient)" stroke="#7A4C00" stroke-width="2" />
    <circle cx="236" cy="210" r="5.5" fill="url(#darkWoodContrast)" />
    <!-- Highlight on screw -->
    <circle cx="233" cy="207" r="2.8" fill="#FFF2B8" opacity="0.9" />
  </g>

  <!-- 2. Central Carpenter's Compass Legs (Letter "A" - EXTRA BOLD) -->
  <!-- Left Leg -->
  <polygon points="156,116 178,116 86,494 62,494" fill="url(#darkWoodContrast)" stroke="url(#mustardGradient)" stroke-width="2" />
  <line x1="159" y1="119" x2="70" y2="489" stroke="url(#mustardLightGradient)" stroke-width="2.5" opacity="0.75" />

  <!-- Right Leg -->
  <polygon points="156,116 178,116 250,494 274,494" fill="url(#darkWoodContrast)" stroke="url(#mustardGradient)" stroke-width="2" />
  <line x1="175" y1="119" x2="266" y2="489" stroke="url(#mustardLightGradient)" stroke-width="2.5" opacity="0.75" />

  <!-- 3. Compass Top Head (Ring / Loop & Hinge - EXTRA BOLD in Mustard Yellow) -->
  <g filter="url(#mustardGlow)">
    <circle cx="167" cy="70" r="33" stroke="url(#mustardGradient)" stroke-width="18" fill="none" />
    <circle cx="167" cy="70" r="24" stroke="#7A4800" stroke-width="1.8" fill="none" opacity="0.8" />
    <circle cx="167" cy="70" r="42" stroke="#FFF7C2" stroke-width="1.5" fill="none" opacity="0.7" />

    <rect x="156" y="94" width="22" height="24" rx="2.5" fill="url(#mustardGradient)" stroke="#7A4800" stroke-width="1.8" />
    
    <circle cx="167" cy="116" r="20" fill="url(#mustardGradient)" stroke="#7A4800" stroke-width="2" />
    <circle cx="167" cy="116" r="8" fill="url(#darkWoodContrast)" />
    <circle cx="164" cy="113" r="2.8" fill="#FFF4BD" opacity="0.9" />

    <path d="M 167,37 L 167,23" stroke="url(#mustardGradient)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- 4. Sculptor's Chisel (Ciseau à bois - EXTRA BOLD) -->
  <g>
    <!-- Handle in Rich Mustard Yellow Wood -->
    <path d="M 12,428 C 18,418 30,394 72,372 C 114,350 126,342 132,348 C 135,353 116,376 80,406 C 44,436 18,444 12,428 Z" 
          fill="url(#mustardLightGradient)" stroke="#8A5600" stroke-width="2.5" />
    
    <path d="M 26,418 C 42,400 78,378 114,360" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.65" stroke-linecap="round" />
    <path d="M 16,426 C 32,410 64,390 98,373" stroke="#7A4800" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round" />

    <polygon points="126,348 135,341 143,351 134,358" fill="url(#mustardGradient)" stroke="#663C00" stroke-width="1.8" />
    
    <path d="M 132,346 L 296,238" stroke="url(#steelBlade)" stroke-width="17" stroke-linecap="round" />
    <path d="M 137,344 L 291,241" stroke="#FFFFFF" stroke-width="3" opacity="0.75" stroke-linecap="round" />
    <path d="M 127,349 L 294,239" stroke="#2B241D" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <polygon points="290,240 304,230 316,246 300,256" fill="url(#mustardGradient)" stroke="#7A4C00" stroke-width="2" />
    <polygon points="294,237 306,229 310,234 298,243" fill="#FFF2B8" opacity="0.9" />
  </g>

  <!-- 5. Curving Text "artisanat" on Left (EXTRA BOLD & CRISP) -->
  <g transform="translate(104, 308) rotate(-78)" filter="url(#mustardGlow)">
    <text x="0" y="0" 
          fill="url(#mustardGradient)" 
          stroke="#6E4000" 
          stroke-width="1.5"
          font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="4">artisanat</text>
  </g>

  <!-- 6. Calligraphic Text "aschi" at Bottom (EXTRA BOLD & VISIBLE) -->
  <g stroke="url(#mustardGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#mustardGlow)">
    <path d="M 106,412 L 106,488 C 106,494 109,496 113,496 M 106,436 C 90,436 84,448 84,466 C 84,482 95,493 106,484" />
    <path d="M 148,422 C 148,413 133,413 130,428 C 127,442 149,450 147,466 C 145,483 129,485 124,474" />
    <path d="M 181,427 C 176,414 161,414 161,452 C 161,486 176,486 181,474" />
    <path d="M 197,386 L 197,490 M 197,440 C 205,428 220,428 220,448 L 220,490" />
    <path d="M 235,422 L 235,490 M 235,397 A 3,3 0 1,1 235,403" />
  </g>
</svg>
