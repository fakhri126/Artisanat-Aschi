server:
  port: 8081
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.uerbqswgxsinayfyntsm}
    password: ${DB_PASSWORD:Aqwzsx 126002}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000 # 5 minutes
      max-lifetime: 600000 # 10 minutes
      connection-timeout: 20000 # 20 seconds
      leak-detection-threshold: 30000 # 30 seconds
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  cache:
    type: caffeine
    cache-names:
      - categories
      - featuredProducts
      - latestProducts
      - projects
      - news
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Actuator monitoring endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# App, JWT and Security properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expirationMs: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://artisanat-aschi.com,https://www.artisanat-aschi.com}

logging:
  level:
    org.springframework.security: INFO
    com.artisanataschi: INFO
