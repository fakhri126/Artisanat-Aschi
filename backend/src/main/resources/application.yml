server:
  port: ${PORT:8081}
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.uerbqswgxsinayfyntsm}
    password: ${DB_PASSWORD:Aqwzsx 126002}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AschiHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000 # 5 minutes
      max-lifetime: 1800000 # 30 minutes (optimisé pour Supavisor / PgBouncer)
      connection-timeout: 10000 # 10 secondes
      leak-detection-threshold: 30000 # 30 secondes
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  cache:
    type: ${CACHE_TYPE:caffeine} # Bascule transparente entre caffeine (local) et redis (production)
    cache-names:
      - categories
      - featuredProducts
      - latestProducts
      - products
      - projects
      - news
      - colors
      - reels
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Actuator & Prometheus monitoring endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: artisanat-aschi-backend

# App, JWT and Security properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expirationMs: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://artisanat-aschi.com,https://www.artisanat-aschi.com}

# Supabase Storage Configuration
supabase:
  url: ${SUPABASE_URL:https://uerbqswgxsinayfyntsm.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:artisanat-aschi-media}

logging:
  level:
    org.springframework.security: INFO
    com.artisanataschi: INFO
    org.hibernate.SQL: WARN
