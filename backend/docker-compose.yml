version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: artisanat-aschi-db
    restart: always
    environment:
      POSTGRES_DB: artisanat_aschi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - artisanat_aschi_db_unique_volume:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: artisanat-aschi-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - artisanat_aschi_redis_volume:/data

volumes:
  artisanat_aschi_db_unique_volume:
  artisanat_aschi_redis_volume:
