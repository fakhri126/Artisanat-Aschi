services:
  # ==========================================
  # 1. Backend Spring Boot (API REST)
  # ==========================================
  - type: web
    name: artisanat-aschi-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/public/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://uerbqswgxsinayfyntsm.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://artisanat-aschi.vercel.app,https://artisanat-aschi-frontend.onrender.com,http://localhost:3000,https://artisanat-aschi.com,https://www.artisanat-aschi.com,https://artisanataschi.com,https://www.artisanataschi.com


