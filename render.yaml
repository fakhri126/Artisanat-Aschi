services:
  # ==========================================
  # 1. Backend Spring Boot (API REST)
  # ==========================================
  - type: web
    name: artisanat-aschi-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/public/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://uerbqswgxsinayfyntsm.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: artisanat-aschi-media
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://artisanat-aschi-frontend.onrender.com

  # ==========================================
  # 2. Frontend Next.js 16
  # ==========================================
  - type: web
    name: artisanat-aschi-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
